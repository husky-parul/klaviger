---
# Individual ServiceAccounts for each agent (agentic IAM pattern)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orchestrator
  namespace: agentic-ml
  labels:
    demo: agentic-iam
    agent: orchestrator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: data-agent
  namespace: agentic-ml
  labels:
    demo: agentic-iam
    agent: data-agent
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: training-agent
  namespace: agentic-ml
  labels:
    demo: agentic-iam
    agent: training-agent
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eval-agent
  namespace: agentic-ml
  labels:
    demo: agentic-iam
    agent: eval-agent
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deploy-agent
  namespace: agentic-ml
  labels:
    demo: agentic-iam
    agent: deploy-agent
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-registry
  namespace: agentic-ml
  labels:
    demo: agentic-iam
---
# Allow authenticated users to access K8s OIDC discovery (needed for Agent Card verification)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-discovery-public
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:service-account-issuer-discovery
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: system:authenticated
