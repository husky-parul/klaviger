---
# Model Registry Service
apiVersion: v1
kind: Service
metadata:
  name: model-registry
  namespace: classic-ml
  labels:
    app: model-registry
spec:
  selector:
    app: model-registry
  ports:
  - name: http
    port: 80
    targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-registry
  namespace: classic-ml
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-registry
  template:
    metadata:
      labels:
        app: model-registry
    spec:
      serviceAccountName: ml-pipeline-sa
      containers:
      - name: model-registry
        image: demo-model-registry:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: AUTH_MODE
          value: "none"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        resources:
          requests: { memory: "32Mi", cpu: "50m" }
          limits: { memory: "128Mi", cpu: "200m" }
---
# Orchestrator Agent
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: classic-ml
  labels:
    app: ml-agent
    agent: orchestrator
spec:
  selector:
    app: ml-agent
    agent: orchestrator
  ports:
  - name: http
    port: 80
    targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: classic-ml
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-agent
      agent: orchestrator
  template:
    metadata:
      labels:
        app: ml-agent
        agent: orchestrator
    spec:
      serviceAccountName: ml-pipeline-sa
      containers:
      - name: agent
        image: demo-ml-agent:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: AGENT_NAME
          value: "orchestrator"
        - name: PORT
          value: "8080"
        - name: DOWNSTREAM
          value: "http://data-agent,http://training-agent,http://eval-agent,http://deploy-agent"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        resources:
          requests: { memory: "32Mi", cpu: "50m" }
          limits: { memory: "128Mi", cpu: "200m" }
